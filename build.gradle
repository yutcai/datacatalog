plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '7.2.1'
}

group = 'io.datacatalog'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Code formatting. `spotlessCheck` runs as part of `check`/`build`, so CI enforces it.
// Run `./gradlew spotlessApply` to auto-format.
spotless {
    java {
        palantirJavaFormat()
        removeUnusedImports()
        formatAnnotations()
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'software.amazon.awssdk:bom:2.53.1'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Registers pgvector's `vector` JdbcType at runtime; the annotations used in code
    // (@JdbcTypeCode, @Array, SqlTypes.VECTOR) all live in hibernate-core.
    // Not in the Spring Boot BOM, so pin it to the same version as the managed hibernate-core.
    runtimeOnly "org.hibernate.orm:hibernate-vector:${dependencyManagement.importedProperties['hibernate.version']}"
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // springdoc 2.8.x targets Spring Boot 3.5; the 3.0.x line is for Spring Boot 4
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.0'
    implementation 'org.liquibase:liquibase-core'
    implementation 'software.amazon.awssdk:s3'
    // In-process MiniLM embedding provider (app.embedding.provider=minilm): ONNX Runtime
    // executes the model, DJL's tokenizers wraps HuggingFace's Rust tokenizer. Neither is
    // in the Spring Boot BOM. The default fake provider uses neither, but they are
    // compile-time dependencies of the provider class itself.
    implementation 'com.microsoft.onnxruntime:onnxruntime:1.22.0'
    implementation 'ai.djl.huggingface:tokenizers:0.33.0'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:localstack'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
